<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${member.id} ? '编辑会员' : '添加会员'">会员管理</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="bi bi-shop"></i> 餐饮收银系统</h3>
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/cashier/dashboard}"><i class="bi bi-speedometer2"></i> 收银台首页</a></li>
            <li><a th:href="@{/cashier/tables}"><i class="bi bi-grid-3x3-gap"></i> 桌台管理</a></li>
            <li><a th:href="@{/cashier/order}"><i class="bi bi-cart-plus"></i> 点餐下单</a></li>
            <li><a th:href="@{/cashier/orders}"><i class="bi bi-receipt"></i> 订单查询</a></li>
            <li><a th:href="@{/cashier/members}" class="active"><i class="bi bi-people"></i> 会员管理</a></li>
            <li><a href="javascript:void(0)" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="navbar">
            <h4><i class="bi bi-person"></i> <span th:text="${member.id} ? '编辑会员' : '添加会员'"></span></h4>
        </div>

        <div class="card" style="max-width: 600px;">
            <div class="card-header"><i class="bi bi-person-fill"></i> 会员信息</div>
            <div class="card-body">
                <form id="memberForm" onsubmit="return saveMember(event)">
                    <input type="hidden" id="memberId" th:value="${member.id}">
                    
                    <div class="form-group">
                        <label>姓名 *</label>
                        <input type="text" id="name" class="form-control" th:value="${member.name}" required>
                    </div>
                    
                    <div class="form-group">
                        <label>手机号 *</label>
                        <input type="text" id="phone" class="form-control" th:value="${member.phone}" 
                               placeholder="请输入11位手机号" required>
                    </div>

                    <div th:if="${member.id != null}" class="form-group">
                        <label>当前积分</label>
                        <input type="text" class="form-control" th:value="${member.points}" disabled>
                    </div>
                    
                    <div style="text-align: center; margin-top: 30px;">
                        <a th:href="@{/cashier/members}" class="btn btn-primary">返回</a>
                        <button type="submit" class="btn btn-success">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script>
        async function saveMember(event) {
            event.preventDefault();
            
            const memberId = document.getElementById('memberId').value;
            const phone = document.getElementById('phone').value;
            
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showAlert('手机号格式不正确，请输入11位有效手机号', 'error');
                return false;
            }
            
            const memberData = {
                name: document.getElementById('name').value,
                phone: phone
            };

            try {
                let result;
                if (memberId) {
                    result = await apiPut('/api/members/' + memberId, memberData);
                } else {
                    result = await apiPost('/api/members', memberData);
                }
                
                if (result.code === 200) {
                    showAlert('保存成功', 'success');
                    setTimeout(() => {
                        window.location.href = '/cashier/members';
                    }, 1500);
                } else {
                    showAlert(result.message || '保存失败', 'error');
                }
            } catch (error) {
                showAlert('网络错误，请重试', 'error');
            }
            return false;
        }
    </script>
</body>
</html>
