﻿<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>订单详情 - 餐饮收银系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="bi bi-shop"></i> 餐饮收银系统</h3>
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/cashier/dashboard}"><i class="bi bi-speedometer2"></i> 收银台首页</a></li>
            <li><a th:href="@{/cashier/tables}"><i class="bi bi-grid-3x3-gap"></i> 桌台管理</a></li>
            <li><a th:href="@{/cashier/order}"><i class="bi bi-cart-plus"></i> 点餐下单</a></li>
            <li><a th:href="@{/cashier/orders}"><i class="bi bi-receipt"></i> 订单查询</a></li>
            <li><a href="javascript:void(0)" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="navbar">
            <h4><i class="bi bi-receipt"></i> 订单详情</h4>
            <span sec:authorize="isAuthenticated()"><i class="bi bi-person-circle"></i> <span sec:authentication="name"></span></span>
        </div>

        <div class="card">
            <div class="card-header">
                <i class="bi bi-info-circle"></i> 订单信息
                <span style="float: right;">
                    <span th:class="'badge ' + ${order.status.name() == 'PAID' ? 'badge-success' : order.status.name() == 'CANCELLED' ? 'badge-danger' : order.status.name() == 'PENDING' ? 'badge-warning' : 'badge-info'}"
                          th:text="${order.status.name() == 'PENDING' ? '待处理' : order.status.name() == 'COOKING' ? '制作中' : order.status.name() == 'SERVED' ? '已上菜' : order.status.name() == 'PAID' ? '已支付' : '已取消'}">
                    </span>
                </span>
            </div>
            <div class="card-body">
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px;">
                    <div>
                        <label style="color: #666; font-size: 12px;">订单号</label>
                        <div style="font-weight: 600;" th:text="${order.orderNo}"></div>
                    </div>
                    <div>
                        <label style="color: #666; font-size: 12px;">桌台</label>
                        <div style="font-weight: 600;" th:text="${order.table.name} ?: ${order.table.tableNo}"></div>
                    </div>
                    <div>
                        <label style="color: #666; font-size: 12px;">用餐人数</label>
                        <div style="font-weight: 600;" th:text="${order.personCount} + '人'"></div>
                    </div>
                    <div>
                        <label style="color: #666; font-size: 12px;">下单时间</label>
                        <div style="font-weight: 600;" th:text="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>
                    <div>
                        <label style="color: #666; font-size: 12px;">收银员</label>
                        <div style="font-weight: 600;" th:text="${order.cashier.realName} ?: ${order.cashier.username}"></div>
                    </div>
                    <div>
                        <label style="color: #666; font-size: 12px;">支付方式</label>
                        <div style="font-weight: 600;" th:text="${order.payMethod != null ? (order.payMethod.name() == 'CASH' ? '现金' : order.payMethod.name() == 'WECHAT' ? '微信' : '支付宝') : '-'}"></div>
                    </div>
                    <div th:if="${order.member != null}">
                        <label style="color: #666; font-size: 12px;">会员</label>
                        <div style="font-weight: 600;" th:text="${order.member.name} + ' (' + ${order.member.phone} + ')'"></div>
                    </div>
                    <div th:if="${order.member != null}">
                        <label style="color: #666; font-size: 12px;">使用积分</label>
                        <div style="font-weight: 600;" th:text="${order.pointsUsed} + '积分'"></div>
                    </div>
                    <div th:if="${order.member != null}">
                        <label style="color: #666; font-size: 12px;">积分抵扣</label>
                        <div style="font-weight: 600; color: #e74c3c;" th:text="'-¥' + ${#numbers.formatDecimal(order.pointsDiscount, 0, 2)}"></div>
                    </div>
                </div>

                <h5 style="margin: 20px 0 10px 0;"><i class="bi bi-list-ul"></i> 订单明细</h5>
                <table class="table">
                    <thead>
                        <tr>
                            <th>菜品</th>
                            <th>单价</th>
                            <th>数量</th>
                            <th>小计</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td th:text="${item.dishName}"></td>
                            <td th:text="'¥' + ${#numbers.formatDecimal(item.dishPrice, 0, 2)}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td th:text="'¥' + ${#numbers.formatDecimal(item.subtotal, 0, 2)}"></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr style="background: #f8f9fa;">
                            <td colspan="3" style="text-align: right; font-weight: bold;">合计：</td>
                            <td style="color: #e74c3c; font-weight: bold; font-size: 18px;" th:text="'¥' + ${#numbers.formatDecimal(order.totalAmount, 0, 2)}"></td>
                        </tr>
                    </tfoot>
                </table>

                <div th:if="${order.remark}" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px;">
                    <label style="color: #666; font-size: 12px;">订单备注</label>
                    <div th:text="${order.remark}"></div>
                </div>

                <div style="margin-top: 30px; text-align: center;">
                    <a th:href="@{/cashier/orders}" class="btn btn-primary"><i class="bi bi-arrow-left"></i> 返回订单列表</a>
                    <a th:if="${order.status.name() != 'PAID' && order.status.name() != 'CANCELLED'}" 
                       th:href="@{/cashier/checkout/{id}(id=${order.id})}" 
                       class="btn btn-success"><i class="bi bi-cash-coin"></i> 去结算</a>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
</body>
</html>
