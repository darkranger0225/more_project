﻿<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>订单管理 - 餐饮收银系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="bi bi-shop"></i> 餐饮收银系统</h3>
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> 管理后台</a></li>
            <li><a th:href="@{/admin/users}"><i class="bi bi-people"></i> 员工管理</a></li>
            <li><a th:href="@{/admin/categories}"><i class="bi bi-tags"></i> 分类管理</a></li>
            <li><a th:href="@{/admin/dishes}"><i class="bi bi-cup-hot"></i> 菜品管理</a></li>
            <li><a th:href="@{/admin/tables}"><i class="bi bi-grid-3x3-gap"></i> 桌台管理</a></li>
            <li><a th:href="@{/admin/orders}" class="active"><i class="bi bi-receipt"></i> 订单管理</a></li>
            <li><a th:href="@{/admin/statistics}"><i class="bi bi-graph-up"></i> 营业统计</a></li>
            <li><a href="javascript:void(0)" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="navbar">
            <h4><i class="bi bi-receipt"></i> 订单管理</h4>
        </div>

        <div class="card">
            <div class="card-header"><i class="bi bi-list"></i> 订单列表</div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>订单号</th>
                            <th>桌台</th>
                            <th>金额</th>
                            <th>状态</th>
                            <th>支付方式</th>
                            <th>收银员</th>
                            <th>下单时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="${order.orderNo}"></td>
                            <td th:text="${order.table.name} ?: ${order.table.tableNo}"></td>
                            <td style="color: #e74c3c; font-weight: bold;" th:text="'¥' + ${#numbers.formatDecimal(order.totalAmount, 0, 2)}"></td>
                            <td>
                                <span th:class="'badge ' + ${order.status.name() == 'PAID' ? 'badge-success' : order.status.name() == 'CANCELLED' ? 'badge-danger' : order.status.name() == 'PENDING' ? 'badge-warning' : 'badge-info'}"
                                      th:text="${order.status.name() == 'PENDING' ? '待处理' : order.status.name() == 'COOKING' ? '制作中' : order.status.name() == 'SERVED' ? '已上菜' : order.status.name() == 'PAID' ? '已支付' : '已取消'}">
                                </span>
                            </td>
                            <td th:text="${order.payMethod != null ? (order.payMethod.name() == 'CASH' ? '现金' : order.payMethod.name() == 'WECHAT' ? '微信' : '支付宝') : '-'}"></td>
                            <td th:text="${order.cashier.realName} ?: ${order.cashier.username}"></td>
                            <td th:text="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
</body>
</html>
