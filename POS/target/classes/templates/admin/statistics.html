﻿<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>营业统计 - 餐饮收银系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="bi bi-shop"></i> 餐饮收银系统</h3>
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> 管理后台</a></li>
            <li><a th:href="@{/admin/users}"><i class="bi bi-people"></i> 员工管理</a></li>
            <li><a th:href="@{/admin/categories}"><i class="bi bi-tags"></i> 分类管理</a></li>
            <li><a th:href="@{/admin/dishes}"><i class="bi bi-cup-hot"></i> 菜品管理</a></li>
            <li><a th:href="@{/admin/tables}"><i class="bi bi-grid-3x3-gap"></i> 桌台管理</a></li>
            <li><a th:href="@{/admin/orders}"><i class="bi bi-receipt"></i> 订单管理</a></li>
            <li><a th:href="@{/admin/statistics}" class="active"><i class="bi bi-graph-up"></i> 营业统计</a></li>
            <li><a href="javascript:void(0)" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="navbar">
            <h4><i class="bi bi-graph-up"></i> 营业统计</h4>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px;">
            <div class="stats-card">
                <div class="icon"><i class="bi bi-calendar-day" style="color: #667eea;"></i></div>
                <div class="number" th:text="${#numbers.formatDecimal(todayStats.totalAmount, 0, 2)}">0.00</div>
                <div class="label">今日营业额</div>
            </div>
            <div class="stats-card">
                <div class="icon"><i class="bi bi-calendar-week" style="color: #27ae60;"></i></div>
                <div class="number" th:text="${#numbers.formatDecimal(weekStats.totalAmount, 0, 2)}">0.00</div>
                <div class="label">本周营业额</div>
            </div>
            <div class="stats-card">
                <div class="icon"><i class="bi bi-calendar-month" style="color: #f39c12;"></i></div>
                <div class="number" th:text="${#numbers.formatDecimal(monthStats.totalAmount, 0, 2)}">0.00</div>
                <div class="label">本月营业额</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="bi bi-graph-up"></i> 近 30 天营业趋势</div>
            <div class="card-body">
                <canvas id="trendChart" height="100"></canvas>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
            <div class="card">
                <div class="card-header"><i class="bi bi-star"></i> 热门菜品（本月）</div>
                <div class="card-body">
                    <table class="table" th:if="${not #lists.isEmpty(monthStats.popularDishes)}">
                        <thead>
                            <tr>
                                <th>排名</th>
                                <th>菜品</th>
                                <th>销量</th>
                                <th>金额</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="dish, iterStat : ${monthStats.popularDishes}" th:if="${iterStat.index < 10}">
                                <td th:text="${iterStat.index + 1}"></td>
                                <td th:text="${dish['dishName']}"></td>
                                <td th:text="${dish['totalQuantity']}"></td>
                                <td th:text="'¥' + ${#numbers.formatDecimal(dish['totalAmount'], 0, 2)}"></td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${#lists.isEmpty(monthStats.popularDishes)}" style="text-align: center; padding: 40px; color: #666;">
                        <p>暂无数据</p>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><i class="bi bi-info-circle"></i> 统计摘要（本月）</div>
                <div class="card-body">
                    <div style="padding: 20px;">
                        <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;">
                            <span>总订单数</span>
                            <span style="font-weight: bold;" th:text="${monthStats.totalOrders}"></span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;">
                            <span>总销量</span>
                            <span style="font-weight: bold;" th:text="${monthStats.totalDishes}"></span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;">
                            <span>客单价</span>
                            <span style="font-weight: bold; color: #e74c3c;" th:text="'¥' + ${#numbers.formatDecimal(monthStats.avgOrderAmount, 0, 2)}"></span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 15px 0;">
                            <span>日均营业额</span>
                            <span style="font-weight: bold; color: #27ae60;" th:text="'¥' + ${#numbers.formatDecimal(monthStats.totalAmount / 30, 0, 2)}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:inline="javascript">
        const dailyStats = [[${dailyStats}]];
        if (dailyStats && dailyStats.length > 0) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dailyStats.map(d => d['date'].substring(5)),
                    datasets: [{
                        label: '营业额',
                        data: dailyStats.map(d => d['amount']),
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: '#667eea',
                        borderWidth: 1
                    }, {
                        label: '订单数',
                        data: dailyStats.map(d => d['count']),
                        backgroundColor: 'rgba(39, 174, 96, 0.8)',
                        borderColor: '#27ae60',
                        borderWidth: 1,
                        yAxisID: 'y1'
                    }]
                },
                options: {
                    responsive: true,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            beginAtZero: true
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            beginAtZero: true,
                            grid: {
                                drawOnChartArea: false
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
