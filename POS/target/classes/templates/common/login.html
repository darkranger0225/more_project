<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐饮收银系统 - 登录</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2><i class="bi bi-shop"></i> 餐饮收银系统</h2>
            
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label><i class="bi bi-person"></i> 用户名</label>
                    <input type="text" name="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label><i class="bi bi-lock"></i> 密码</label>
                    <input type="password" name="password" placeholder="请输入密码" required>
                </div>
                <div style="text-align: right; margin-bottom: 20px;">
                    <a th:href="@{/forgot-password}" style="color: #667eea; text-decoration: none;">忘记密码?</a>
                </div>
                <button type="submit">登录</button>
            </form>
            
            <div style="margin-top: 20px; text-align: center; color: #666; font-size: 12px;">
                <p>©️2026 GJC版权所有</p>
            </div>
        </div>
    </div>
</body>
</html>
