﻿<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${category.id} ? '编辑分类' : '添加分类'">分类管理</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="bi bi-shop"></i> 餐饮收银系统</h3>
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> 管理后台</a></li>
            <li><a th:href="@{/admin/users}"><i class="bi bi-people"></i> 员工管理</a></li>
            <li><a th:href="@{/admin/categories}" class="active"><i class="bi bi-tags"></i> 分类管理</a></li>
            <li><a th:href="@{/admin/dishes}"><i class="bi bi-cup-hot"></i> 菜品管理</a></li>
            <li><a th:href="@{/admin/tables}"><i class="bi bi-grid-3x3-gap"></i> 桌台管理</a></li>
            <li><a th:href="@{/admin/orders}"><i class="bi bi-receipt"></i> 订单管理</a></li>
            <li><a th:href="@{/admin/statistics}"><i class="bi bi-graph-up"></i> 营业统计</a></li>
            <li><a href="javascript:void(0)" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="navbar">
            <h4><i class="bi bi-tag"></i> <span th:text="${category.id} ? '编辑分类' : '添加分类'"></span></h4>
        </div>

        <div class="card" style="max-width: 600px;">
            <div class="card-header"><i class="bi bi-tag-fill"></i> 分类信息</div>
            <div class="card-body">
                <form id="categoryForm" onsubmit="return saveCategory(event)">
                    <input type="hidden" id="categoryId" th:value="${category.id}">
                    <div class="form-group">
                        <label>分类名称 *</label>
                        <input type="text" id="name" class="form-control" th:value="${category.name}" required>
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="description" class="form-control" rows="3" th:text="${category.description}"></textarea>
                    </div>
                    <div class="form-group">
                        <label>排序</label>
                        <input type="number" id="sortOrder" class="form-control" th:value="${category.sortOrder} ?: 0">
                    </div>
                    <div style="text-align: center; margin-top: 30px;">
                        <a th:href="@{/admin/categories}" class="btn btn-primary">返回</a>
                        <button type="submit" class="btn btn-success">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script>
        async function saveCategory(event) {
            event.preventDefault();
            const categoryId = document.getElementById('categoryId').value;
            const data = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                sortOrder: parseInt(document.getElementById('sortOrder').value) || 0
            };
            try {
                let result;
                if (categoryId) { result = await apiPut('/api/admin/categories/' + categoryId, data); }
                else { result = await apiPost('/api/admin/categories', data); }
                if (result.code === 200) {
                    showAlert('保存成功', 'success');
                    setTimeout(() => { window.location.href = '/admin/categories'; }, 1500);
                } else { showAlert(result.message || '保存失败', 'error'); }
            } catch (error) { showAlert('网络错误，请重试', 'error'); }
            return false;
        }
    </script>
</body>
</html>
