﻿<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>菜品管理 - 餐饮收银系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="bi bi-shop"></i> 餐饮收银系统</h3>
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> 管理后台</a></li>
            <li><a th:href="@{/admin/users}"><i class="bi bi-people"></i> 员工管理</a></li>
            <li><a th:href="@{/admin/categories}"><i class="bi bi-tags"></i> 分类管理</a></li>
            <li><a th:href="@{/admin/dishes}" class="active"><i class="bi bi-cup-hot"></i> 菜品管理</a></li>
            <li><a th:href="@{/admin/tables}"><i class="bi bi-grid-3x3-gap"></i> 桌台管理</a></li>
            <li><a th:href="@{/admin/orders}"><i class="bi bi-receipt"></i> 订单管理</a></li>
            <li><a th:href="@{/admin/statistics}"><i class="bi bi-graph-up"></i> 营业统计</a></li>
            <li><a href="javascript:void(0)" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="navbar">
            <h4><i class="bi bi-cup-hot"></i> 菜品管理</h4>
            <a th:href="@{/admin/dishes/add}" class="btn btn-primary"><i class="bi bi-plus"></i> 添加菜品</a>
        </div>

        <div class="card">
            <div class="card-header"><i class="bi bi-list"></i> 菜品列表</div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>图片</th>
                            <th>名称</th>
                            <th>分类</th>
                            <th>价格</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="dish : ${dishes}">
                            <td th:text="${dish.id}"></td>
                            <td>
                                <img th:if="${dish.image}" th:src="${dish.image}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
                                <span th:unless="${dish.image}">-</span>
                            </td>
                            <td th:text="${dish.name}"></td>
                            <td th:text="${dish.category.name}"></td>
                            <td style="color: #e74c3c; font-weight: bold;" th:text="'¥' + ${#numbers.formatDecimal(dish.price, 0, 2)}"></td>
                            <td>
                                <span th:class="'badge ' + ${dish.status.name() == 'ON_SALE' ? 'badge-success' : 'badge-warning'}"
                                      th:text="${dish.status.name() == 'ON_SALE' ? '在售' : '下架'}"></span>
                            </td>
                            <td>
                                <a th:href="@{/admin/dishes/edit/{id}(id=${dish.id})}" class="btn btn-primary btn-sm">编辑</a>
                                <button th:if="${dish.status.name() == 'ON_SALE'}" 
                                        th:onclick="offSale([[${dish.id}]])" 
                                        class="btn btn-warning btn-sm">下架</button>
                                <button th:if="${dish.status.name() == 'OFF_SALE'}" 
                                        th:onclick="onSale([[${dish.id}]])" 
                                        class="btn btn-success btn-sm">上架</button>
                                <button th:onclick="deleteDish([[${dish.id}]])" class="btn btn-danger btn-sm">删除</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script>
        function offSale(id) {
            confirmAction('确定要下架该菜品吗？', async () => {
                const result = await apiPost('/api/admin/dishes/' + id + '/off-sale', {});
                if (result.code === 200) { showAlert('下架成功', 'success'); location.reload(); }
                else { showAlert(result.message, 'error'); }
            });
        }
        function onSale(id) {
            confirmAction('确定要上架该菜品吗？', async () => {
                const result = await apiPost('/api/admin/dishes/' + id + '/on-sale', {});
                if (result.code === 200) { showAlert('上架成功', 'success'); location.reload(); }
                else { showAlert(result.message, 'error'); }
            });
        }
        function deleteDish(id) {
            confirmAction('确定要删除该菜品吗？', async () => {
                const result = await apiDelete('/api/admin/dishes/' + id);
                if (result.code === 200) { showAlert('删除成功', 'success'); location.reload(); }
                else { showAlert(result.message, 'error'); }
            });
        }
    </script>
</body>
</html>
