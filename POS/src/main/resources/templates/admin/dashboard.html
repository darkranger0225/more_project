﻿<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>管理后台 - 餐饮收银系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="bi bi-shop"></i> 餐饮收银系统</h3>
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/admin/dashboard}" class="active"><i class="bi bi-speedometer2"></i> 管理后台</a></li>
            <li><a th:href="@{/admin/users}"><i class="bi bi-people"></i> 员工管理</a></li>
            <li><a th:href="@{/admin/categories}"><i class="bi bi-tags"></i> 分类管理</a></li>
            <li><a th:href="@{/admin/dishes}"><i class="bi bi-cup-hot"></i> 菜品管理</a></li>
            <li><a th:href="@{/admin/tables}"><i class="bi bi-grid-3x3-gap"></i> 桌台管理</a></li>
            <li><a th:href="@{/admin/orders}"><i class="bi bi-receipt"></i> 订单管理</a></li>
            <li><a th:href="@{/admin/statistics}"><i class="bi bi-graph-up"></i> 营业统计</a></li>
            <li><a href="javascript:void(0)" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="navbar">
            <h4><i class="bi bi-speedometer2"></i> 管理后台</h4>
            <span sec:authorize="isAuthenticated()"><i class="bi bi-person-circle"></i> <span sec:authentication="name"></span></span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px;">
            <div class="stats-card">
                <div class="icon"><i class="bi bi-currency-yen" style="color: #27ae60;"></i></div>
                <div class="number" th:text="${todayStats != null ? #numbers.formatDecimal(todayStats.totalAmount, 0, 2) : '0.00'}">0.00</div>
                <div class="label">今日营业额</div>
            </div>
            <div class="stats-card">
                <div class="icon"><i class="bi bi-receipt" style="color: #667eea;"></i></div>
                <div class="number" th:text="${todayStats != null ? todayStats.totalOrders : 0}">0</div>
                <div class="label">今日订单</div>
            </div>
            <div class="stats-card">
                <div class="icon"><i class="bi bi-cup-hot" style="color: #f39c12;"></i></div>
                <div class="number" th:text="${todayStats != null ? todayStats.totalDishes : 0}">0</div>
                <div class="label">今日销量</div>
            </div>
            <div class="stats-card">
                <div class="icon"><i class="bi bi-grid-3x3-gap" style="color: #e74c3c;"></i></div>
                <div class="number" th:text="${todayStats != null ? #numbers.formatDecimal(todayStats.avgOrderAmount, 0, 2) : '0.00'}">0.00</div>
                <div class="label">客单价</div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-graph-up"></i> 近 7 天营业趋势
                </div>
                <div class="card-body">
                    <canvas id="trendChart" height="200"></canvas>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-star"></i> 热门菜品
                </div>
                <div class="card-body">
                    <table class="table" th:if="${todayStats != null and todayStats.popularDishes != null and not #lists.isEmpty(todayStats.popularDishes)}">
                        <thead>
                            <tr>
                                <th>菜品</th>
                                <th>销量</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="dish, iterStat : ${todayStats.popularDishes}" th:if="${iterStat.index < 5}">
                                <td th:text="${dish['dishName']}"></td>
                                <td th:text="${dish['totalQuantity']}"></td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${todayStats == null or todayStats.popularDishes == null or #lists.isEmpty(todayStats.popularDishes)}" style="text-align: center; padding: 40px; color: #666;">
                        <p>暂无数据</p>
                    </div>
                </div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px;">
            <a th:href="@{/admin/dishes}" class="card" style="text-decoration: none; color: inherit;">
                <div class="card-body" style="text-align: center; padding: 30px;">
                    <i class="bi bi-cup-hot" style="font-size: 36px; color: #f39c12;"></i>
                    <h5 style="margin-top: 10px;">菜品管理</h5>
                </div>
            </a>
            <a th:href="@{/admin/tables}" class="card" style="text-decoration: none; color: inherit;">
                <div class="card-body" style="text-align: center; padding: 30px;">
                    <i class="bi bi-grid-3x3-gap" style="font-size: 36px; color: #27ae60;"></i>
                    <h5 style="margin-top: 10px;">桌台管理</h5>
                </div>
            </a>
            <a th:href="@{/admin/users}" class="card" style="text-decoration: none; color: inherit;">
                <div class="card-body" style="text-align: center; padding: 30px;">
                    <i class="bi bi-people" style="font-size: 36px; color: #667eea;"></i>
                    <h5 style="margin-top: 10px;">员工管理</h5>
                </div>
            </a>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:inline="javascript">
        const dailyStats = [[${dailyStats}]];
        if (dailyStats && dailyStats.length > 0) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dailyStats.map(d => d['date'].substring(5)),
                    datasets: [{
                        label: '营业额',
                        data: dailyStats.map(d => d['amount']),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
