﻿<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 餐饮收银系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2><i class="bi bi-key"></i> 忘记密码</h2>
            
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            
            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <label><i class="bi bi-person"></i> 用户名</label>
                    <input type="text" name="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label><i class="bi bi-phone"></i> 手机号</label>
                    <input type="tel" name="phone" placeholder="请输入注册手机号" required>
                </div>
                <div class="form-group">
                    <label><i class="bi bi-lock"></i> 新密码</label>
                    <input type="password" name="newPassword" placeholder="请输入新密码" required>
                </div>
                <div class="form-group">
                    <label><i class="bi bi-lock"></i> 确认新密码</label>
                    <input type="password" name="confirmPassword" placeholder="请确认新密码" required>
                </div>
                <button type="submit">重置密码</button>
            </form>
            
            <div style="margin-top: 20px; text-align: center;">
                <a th:href="@{/login}" style="color: #667eea; text-decoration: none;">返回登录</a>
            </div>
        </div>
    </div>
</body>
</html>
