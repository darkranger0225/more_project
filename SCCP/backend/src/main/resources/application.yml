server:
  port: 8080
  # 绑定到所有网卡，允许外部设备访问
  address: 0.0.0.0

spring:
  application:
    name: school-communication
  datasource:
    url: jdbc:mysql://localhost:3306/school_communication?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境关闭SQL日志输出，避免性能影响
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: schoolCommunicationSecretKey2024
  expiration: 86400000

file:
  upload:
    path: ${user.home}/school-communication/uploads/
    access-url: /uploads/
    # 配置外网可访问的基础URL，用于生成图片访问链接
    # 开发环境使用 localhost，真机环境使用实际IP
    base-url: http://localhost:8080