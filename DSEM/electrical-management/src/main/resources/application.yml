server:
  port: 8080

spring:
  application:
    name: electrical-management
  
  datasource:
    url: jdbc:mysql://localhost:3306/electrical_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: electricalManagementSecretKey2024
  expiration: 86400000

logging:
  level:
    com.example.electrical: info
    org.apache.ibatis: warn
