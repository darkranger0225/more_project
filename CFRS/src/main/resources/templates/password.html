<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout ('修改密码', ~{::main})}">
<main>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">修改密码</h4>
                    </div>
                    <div class="card-body">
                        <form id="passwordForm">
                            <div class="mb-3">
                                <label for="oldPassword" class="form-label">原密码</label>
                                <input type="password" class="form-control" id="oldPassword" name="oldPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">新密码</label>
                                <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="6">
                                <div class="form-text">密码长度至少6位</div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">确认新密码</label>
                                <input type="password" class="form-control" id="confirmPassword" required minlength="6">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">修改密码</button>
                            </div>
                        </form>
                        <div id="message" class="alert mt-3 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                const messageDiv = document.getElementById('message');
                messageDiv.classList.remove('d-none', 'alert-success', 'alert-danger');
                messageDiv.classList.add('alert-danger');
                messageDiv.textContent = '两次输入的新密码不一致';
                return;
            }
            
            const formData = new URLSearchParams();
            formData.append('oldPassword', oldPassword);
            formData.append('newPassword', newPassword);
            
            fetch('/api/user/password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const messageDiv = document.getElementById('message');
                messageDiv.classList.remove('d-none', 'alert-success', 'alert-danger');
                if (data.code === 200) {
                    messageDiv.classList.add('alert-success');
                    messageDiv.textContent = '密码修改成功';
                    document.getElementById('passwordForm').reset();
                } else {
                    messageDiv.classList.add('alert-danger');
                    messageDiv.textContent = data.message;
                }
            });
        });
    </script>
</main>
</html>
