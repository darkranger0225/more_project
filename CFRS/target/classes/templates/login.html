<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout ('登录', ~{::main})}">
<main>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">用户登录</h4>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="mb-3 text-end">
                                <a href="#" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">忘记密码？</a>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">登录</button>
                                <a href="/register" class="btn btn-outline-secondary">还没有账号？立即注册</a>
                            </div>
                        </form>
                        <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            fetch('/api/auth/login', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    window.location.href = '/';
                } else {
                    document.getElementById('errorMessage').textContent = data.message;
                    document.getElementById('errorMessage').classList.remove('d-none');
                }
            })
            .catch(error => {
                document.getElementById('errorMessage').textContent = '登录失败，请重试';
                document.getElementById('errorMessage').classList.remove('d-none');
            });
        });
    </script>

    <!-- 忘记密码模态框 -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">忘记密码</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="forgotPasswordForm">
                        <div class="mb-3">
                            <label for="fpUsername" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="fpUsername" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="fpPhone" class="form-label">手机号</label>
                            <input type="tel" class="form-control" id="fpPhone" name="phone" required>
                        </div>
                        <div class="mb-3">
                            <label for="fpNewPassword" class="form-label">新密码</label>
                            <input type="password" class="form-control" id="fpNewPassword" name="newPassword" required minlength="6">
                            <div class="form-text">密码长度至少6位</div>
                        </div>
                        <div class="mb-3">
                            <label for="fpConfirmPassword" class="form-label">确认新密码</label>
                            <input type="password" class="form-control" id="fpConfirmPassword" required minlength="6">
                        </div>
                    </form>
                    <div id="fpMessage" class="alert d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="resetPassword()">重置密码</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function resetPassword() {
            const username = document.getElementById('fpUsername').value;
            const phone = document.getElementById('fpPhone').value;
            const newPassword = document.getElementById('fpNewPassword').value;
            const confirmPassword = document.getElementById('fpConfirmPassword').value;
            const messageDiv = document.getElementById('fpMessage');

            if (!username || !phone || !newPassword) {
                messageDiv.className = 'alert alert-danger';
                messageDiv.textContent = '请填写所有必填项';
                messageDiv.classList.remove('d-none');
                return;
            }

            if (newPassword !== confirmPassword) {
                messageDiv.className = 'alert alert-danger';
                messageDiv.textContent = '两次输入的密码不一致';
                messageDiv.classList.remove('d-none');
                return;
            }

            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('phone', phone);
            formData.append('newPassword', newPassword);

            fetch('/api/user/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    messageDiv.className = 'alert alert-success';
                    messageDiv.textContent = '密码重置成功，请使用新密码登录';
                    messageDiv.classList.remove('d-none');
                    setTimeout(() => {
                        bootstrap.Modal.getInstance(document.getElementById('forgotPasswordModal')).hide();
                        document.getElementById('forgotPasswordForm').reset();
                        messageDiv.classList.add('d-none');
                    }, 2000);
                } else {
                    messageDiv.className = 'alert alert-danger';
                    messageDiv.textContent = data.message;
                    messageDiv.classList.remove('d-none');
                }
            })
            .catch(error => {
                messageDiv.className = 'alert alert-danger';
                messageDiv.textContent = '重置失败，请重试';
                messageDiv.classList.remove('d-none');
            });
        }
    </script>
</main>
</html>
